# Scenario config for self-contained scenario directories (run_eval.py --scenario_dir).
# No route_dir / scenic_dir / bench_id: the Scenic file, route.pickle and
# opt_params.json are all found inside the scenario directory itself
# (see safebench/util/scenario_dir.py).
policy_type: 'scenic'
scenario_category: 'scenic'

scenic_mode2d: true
sample_num: 50
opt_step: 10
select_num: 2

method: 'scenic'
scenario_id: null
route_id: [0]

ego_action_dim: 2
ego_state_dim: 4
ego_action_limit: 1.0
